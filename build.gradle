plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(23) } }
repositories { mavenCentral() }
ext { set('springAiVersion', '1.0.1') }
dependencyManagement {
    imports { mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}" }
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    if (project.findProperty('provider') == 'azure') {
        implementation 'org.springframework.ai:spring-ai-starter-model-azure-openai'
    }
    if (project.findProperty('provider') == 'ollama') {
        implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    }
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.wiremock.integrations:wiremock-spring-boot:3.9.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform { excludeTags 'live' }
}
tasks.register('liveTest', Test) {
    description = 'Calls a real configured LLM; consumes provider quota.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live' }
    shouldRunAfter test
}
